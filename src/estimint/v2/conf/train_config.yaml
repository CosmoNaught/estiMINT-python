data_file: "datasets/estimint_simulations_y9.parquet"
split_file: "datasets/split.csv"
num_workers: 0
use_existing_split: false
target: "eir"
stratify: true
calib_frac: 0.06

# model
width: 256
depth: 4
n_quad: 96
mlp_residual: false
dropout_rate: 0.0
n_bins: 24
rqs_bounds: 6

# Hyperparameters
num_epochs: 200
min_epochs: 100
patience: 50
lr: 1e-3
batch_size: 256
weight_decay: 1e-4
n_ensembles: 1

# Checkpoint
checkpoint_dir: "${output_dir}ckpts-${cur_time}"

# General
cur_time: ${now:%Y-%m-%dT%H:%M:%S}
seed: 42
use_wandb: false
output_dir: "train_outputs/"
wandb:
  project: "estimint-training"
  name: "train-${cur_time}"