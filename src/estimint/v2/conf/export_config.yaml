predictor: "prev_y9"
target: "eir"
name: "${predictor}-${target}"

# Data
features_scaler_file: train_outputs/${name}/features_scaler.pkl
target_scaler_file: train_outputs/${name}/target_scaler.pkl


# Model - ensure these match the checkpointed model's parameters
model_name: "RQS"
width: 256
depth: 2
mlp_residual: true
n_bins: 24
rqs_bounds: 6
dropout_rate: 0.05

# Checkpointing
checkpoint_dir: ???

# General
seed: 42
artifact_dir: "artifacts/${name}"